name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Set up Qt 5.15.2
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtandroidextras'
    
    - name: Set environment variables
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOST=linux-x86_64" >> $GITHUB_ENV
        echo "ANDROID_NDK_PLATFORM=android-23" >> $GITHUB_ENV
        echo "ANDROID_NDK_TOOLCHAIN_VERSION=4.9" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "SKIP_JDK_VERSION_CHECK=true" >> $GITHUB_ENV
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Android APKs
      run: |
        # Clean previous builds
        rm -rf build/android/*
        
        # Mobile build
        qmake -config release "CONFIG += release_android build_mobile" ANDROID_ABIS="arm64-v8a" -spec android-clang
        make clean
        make -j8
        make install INSTALL_ROOT=build/android/build
        androiddeployqt --gradle --no-gdbserver --output build/android/build --input android-vesc_tool-deployment-settings.json --android-platform android-33
        mv build/android/build/build/outputs/apk/debug/build-debug.apk build/android/vesc_tool_mobile.apk
        rm -rf build/android/build
        rm -rf build/android/obj
        rm -f build/android/libvesc_tool*
        
        # Full build
        qmake -config release "CONFIG += release_android" ANDROID_ABIS="arm64-v8a" -spec android-clang
        make clean
        make -j8
        make install INSTALL_ROOT=build/android/build
        androiddeployqt --gradle --no-gdbserver --output build/android/build --input android-vesc_tool-deployment-settings.json --android-platform android-33
        mv build/android/build/build/outputs/apk/debug/build-debug.apk build/android/vesc_tool_full.apk
        rm -rf build/android/build
        rm -rf build/android/obj
        rm -f build/android/libvesc_tool*
        
        # Zip APKs
        cd build/android
        zip vesc_tool_android.zip vesc_tool_mobile.apk vesc_tool_full.apk
        rm -f vesc_tool_mobile.apk
        rm -f vesc_tool_full.apk
        cd ../..
    
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: build/android/vesc_tool_android.zip
    
    - name: Upload individual APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: build/android/*.apk
