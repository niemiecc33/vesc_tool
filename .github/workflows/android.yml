name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/niemiecc33/vesc_tool_builder:latest
      options: --user root
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Make build script executable
      run: chmod +x build_android
    
    - name: Build Android APKs
      run: ./build_android
    
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: build/android/vesc_tool_android.zip
    
    - name: Upload individual APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: build/android/*.apk
